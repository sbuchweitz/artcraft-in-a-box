# Tool configuration for the build scripts in tools/ (dev dependencies: requirements-dev.txt).

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
addopts = "--cov=artbox --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S310"]  # urllib with fixed https:// GitHub URLs

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
