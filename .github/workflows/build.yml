name: build

# Docs-only changes don't rebuild: every build stamps a new revision label, so `latest` would get a
# new digest (and auto-updaters would redeploy) for identical content.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/dependabot.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check tools tests
          ruff format --check tools tests
      - name: Unit tests
        run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Put the description etc. on the multi-arch index too, so the GHCR package page shows them.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: artcraft-in-a-box:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: tests/smoke.sh artcraft-in-a-box:ci

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=ArtCraft in a Box
            org.opencontainers.image.description=nginx serving the ArtCraft open-source web apps, one per sub-folder, with a tile overview page
          annotations: |
            org.opencontainers.image.title=ArtCraft in a Box
            org.opencontainers.image.description=nginx serving the ArtCraft open-source web apps, one per sub-folder, with a tile overview page

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The site stage runs once on the runner's platform; the final stage only copies files,
      # so arm64 needs no QEMU.
      - name: Build and push (amd64, arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "### Apps"
            jq -r '.apps[] | "- \(.name) \(.version)"' apps.json
          } >> "$GITHUB_STEP_SUMMARY"
