# ArtCraft in a Box: landing page at /, one static WebAssembly app per sub-folder (/photocraft/, ...).
#
# Large files are stored gzip-only (foo.wasm.gz, no foo.wasm): `gzip_static always` sends the .gz
# as-is, and `gunzip` decompresses it on the fly for the rare client that can't take gzip.

# Adds to the http-level mime.types (blocks at the same level merge).
types {
    application/manifest+json  webmanifest;
}

# Content-hashed names (photocraft-web-72921900975c7e6f_bg.wasm) are immutable: cache for a year.
# Everything else keeps its name across releases, so browsers revalidate it (cheap 304s via ETag).
map $uri $artcraft_cache_control {
    "~-[0-9a-f]{16}(_bg)?\.(js|wasm)$"  "public, max-age=31536000, immutable";
    default                             "no-cache";
}

# Strict CSP for the landing page only; the apps ship their own wasm-bindgen loaders and are left alone.
map $uri $artcraft_csp {
    "/"            "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'";
    "/index.html"  "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'";
    default        "";
}

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/artcraft;
    index  index.html;

    server_tokens      off;
    absolute_redirect  off;  # /photocraft -> /photocraft/ stays relative behind proxies and port maps
    charset            utf-8;

    gzip_static  always;
    gunzip       on;
    gzip         on;
    gzip_vary    on;
    gzip_types   text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Empty values (e.g. $artcraft_csp outside the landing page) suppress the header.
    add_header Cache-Control           $artcraft_cache_control;
    add_header Content-Security-Policy $artcraft_csp;
    add_header X-Content-Type-Options  nosniff always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;

    location = /healthz {
        access_log    off;
        default_type  text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles (.htaccess and friends from upstream archives).
    location ~ /\. {
        return 404;
    }
}
